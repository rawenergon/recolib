name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync web assets to Android
        run: |
          set +e
          npx cap sync android 2>&1 | tee /tmp/sync.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then node .github/scripts/commit-failure-log.mjs /tmp/sync.log "sync.log"; fi
          exit $rc

      - name: Build debug APK
        run: |
          set +e
          chmod +x android/gradlew
          ./android/gradlew -p android assembleDebug 2>&1 | tee /tmp/gradle.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then node .github/scripts/commit-failure-log.mjs /tmp/gradle.log "gradle.log"; fi
          exit $rc

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RECO-LIB.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RECO-LIB.apk
          path: RECO-LIB.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: RECO-LIB.apk
          generate_release_notes: true