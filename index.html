    <!-- JSON-LD Structured Data for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "RECO LIB",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web",

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'media', // Uses system preference
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              background: "var(--background)",
              foreground: "var(--foreground)",
              primary: "var(--primary)",
            },
          },
        },
      };
    </script>
    <!-- Add Tailwind Animate Plugin for smooth UI transitions -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap');
      
      @media (prefers-color-scheme: light) {
        body {
          background-color: #f8fafc;
          color: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
          background: #cbd5e1;
        }
        ::-webkit-scrollbar-thumb:hover {
          background: #94a3b8;
        }
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #050505;
          color: #f8fafc;
        }
        ::-webkit-scrollbar-thumb {
          background: #334155;
        }
        ::-webkit-scrollbar-thumb:hover {
          background: #475569;
        }
      }

      body {
        font-family: 'Outfit', sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        border-radius: 4px;
      }
      
      /* Animation Utilities (Polyfill for tailwindcss-animate in browser CDN) */
      @keyframes enter {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes slideIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      .animate-in {
        animation-fill-mode: forwards;
        animation-duration: 0.5s;
        animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
      }
      .fade-in {
        animation-name: fadeIn;
      }
      .zoom-in-95 {
        animation-name: enter;
      }
      .slide-in-from-bottom-2 {
        animation-name: slideIn;
      }
      .slide-in-from-bottom-4 {
        animation-name: slideIn;
      }
      .slide-in-from-bottom-8 {
        animation-name: slideIn;
      }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>

</body>
